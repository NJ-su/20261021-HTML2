<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>課堂時間管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Iansui&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<style>
:root{
  /* 明亮清爽配色：奶油白底 + 番茄紅 / 葉子綠 / 天空藍 / 奶油黃 */
  --bg1:#fffaf2; --bg2:#fff1e6;
  --paper:#ffffff; --paper-2:#fff6ea;
  --ink:#5b4040; --dim:#a68b88;
  --line:#f7c6b8;            /* 邊框：淡蜜桃 */
  --tomato:#ff6b5b; --tomato-d:#e84a3b;
  --leaf:#7cc576; --sky:#8fcdea; --butter:#ffd87a; --pink:#ffc2cf;
  --red:#e8384f; --acc:var(--tomato); --acc-d:var(--tomato-d);
  --hand:"Iansui","LXGW WenKai TC","BiauKai","Kaiti TC","DFKai-SB","標楷體","Kaiti SC","Segoe Print","Bradley Hand","Marker Felt",cursive;
  --shadow:4px 4px 0 rgba(255,107,91,.22);
  --blob:22px 28px 18px 30px / 28px 18px 30px 22px;
  --safe-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:var(--ink);font-family:var(--hand);font-size:19px;line-height:1.5;min-height:100vh;display:flex;flex-direction:column;padding-top:var(--safe-top);
  background:radial-gradient(rgba(255,160,140,.16) 2px,transparent 2.2px) 0 0/30px 30px, linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  background-attachment:fixed;transition:background .6s;
}
body.alert{background:radial-gradient(rgba(232,56,79,.14) 2px,transparent 2.2px) 0 0/30px 30px, linear-gradient(160deg,#ffe9e6 0%,#ffd3d3 100%);background-attachment:fixed}
body.fs.idle{cursor:none}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.panel{flex:1;display:flex;flex-direction:column;position:relative;z-index:1}
.d,.c{display:inline-block;text-align:center;font-style:normal}
.d{width:.64em} .c{width:.34em}

/* 背景小裝飾 */
.deco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.deco span{position:absolute;font-size:clamp(24px,3vw,46px);opacity:.3;animation:floaty 6s ease-in-out infinite}
.deco span:nth-child(2n){animation-duration:8s;animation-delay:-2s}
.deco span:nth-child(3n){animation-duration:7s;animation-delay:-4s}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(5deg)}}

/* 分頁與工具列 */
.tabs{display:flex;gap:10px;padding:14px 4vw 0;transition:opacity .4s;flex-wrap:wrap;position:relative;z-index:2}
.tab{background:transparent;border:2.5px dashed transparent;border-radius:var(--blob);color:var(--dim);font-size:clamp(19px,1.8vw,29px);padding:6px 22px;cursor:pointer}
.tab:hover{border-color:var(--line)}
.tab[aria-selected=true]{background:var(--paper);color:var(--tomato-d);border:2.5px solid var(--line);box-shadow:var(--shadow);transform:rotate(-1deg)}
.toolbar{position:fixed;top:calc(14px + var(--safe-top));right:14px;z-index:30;display:flex;gap:10px;transition:opacity .4s}
body.fs.idle .toolbar,body.fs.idle .tabs{opacity:0;pointer-events:none}
.btn{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--blob);padding:6px 18px;font-size:18px;cursor:pointer;box-shadow:3px 3px 0 rgba(255,107,91,.25);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:5px 5px 0 rgba(255,107,91,.25)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(255,107,91,.25)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tomato);color:#fff;padding:10px 20px;border-radius:var(--blob);z-index:40;display:none}
.bar{height:1.6vh;min-height:14px;background:#ffe3da;border:2.5px solid var(--line);border-radius:99px;margin:1.4vh auto 0;max-width:70vw;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#ff8c7e 12px 24px);border-radius:99px;transition:width .5s linear}

/* 考試大鐘 */
.stage{flex:1;display:flex;flex-direction:column;padding:2vh 4vw 3vh;gap:1.5vh;position:relative;z-index:1}
.subject{font-size:clamp(30px,5vw,88px);line-height:1.2;max-width:78vw;-webkit-text-stroke:.025em currentColor}
.subject.empty{color:var(--dim);-webkit-text-stroke:0}
.date{font-size:clamp(20px,2.4vw,44px);color:var(--dim);margin-top:.4vh}
.clock{flex:1;display:flex;align-items:center;justify-content:center;font-size:min(17vw,34vh);line-height:1;color:var(--tomato-d);-webkit-text-stroke:.03em currentColor;text-shadow:.04em .04em 0 rgba(255,150,130,.3)}
body.alert .clock,body.alert .remain b{color:var(--red)}
body.alert .bar i{background:repeating-linear-gradient(-45deg,var(--red) 0 12px,#ff7a8a 12px 24px)}
.status{text-align:center}
.status .label{font-size:clamp(20px,2.6vw,48px);color:var(--dim)}
.remain{font-size:clamp(30px,5.4vw,100px);line-height:1.2;-webkit-text-stroke:.02em currentColor}
.remain small{font-size:.45em;color:var(--dim);margin-left:.4em;-webkit-text-stroke:0}
body.alert .remain small{color:#d9606e}
.remain.done{color:var(--acc-d)}
.info{display:grid;grid-template-columns:1.2fr 1.4fr repeat(3,.7fr);gap:1.4vw;margin-top:1vh}
.cell{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--blob);padding:.8vh 1.1vw 1vh;min-width:0;box-shadow:var(--shadow);transform:rotate(-.7deg)}
.cell:nth-child(even){transform:rotate(.7deg)}
.cell:nth-child(1){background:#fff4cf;border-color:#f6d98a}
.cell:nth-child(2){background:#e8f6e6;border-color:#b5dfb0}
.cell:nth-child(3){background:#e6f4fb;border-color:#a9d8ee}
.cell:nth-child(4){background:#e6f4fb;border-color:#a9d8ee}
.cell .k{font-size:clamp(14px,1.4vw,25px);color:var(--dim)}
.cell .v{font-size:clamp(22px,2.7vw,50px);overflow-wrap:anywhere;line-height:1.25}
.cell .v.num{font-size:clamp(30px,4.2vw,74px)}
.cell.absent{background:var(--pink);border-color:#f59cb0}
.cell.absent .k{color:#a85468}
.cell.absent .v{color:#c23a58}
.drawer{position:fixed;top:calc(66px + var(--safe-top));right:14px;z-index:20;width:350px;max-width:calc(100vw - 28px);max-height:calc(100vh - 82px);overflow-y:auto;background:var(--paper);border:2.5px solid var(--line);border-radius:var(--blob);padding:16px 20px;box-shadow:6px 6px 0 rgba(255,107,91,.25)}
.drawer h2{margin:0 0 12px;font-size:22px}
.f{margin-bottom:12px}
.f label{display:block;font-size:16px;color:var(--dim);margin-bottom:4px}
input[type=text],input[type=time],input[type=number],select,.f input{width:100%;background:var(--paper-2);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:18px}
select option{color:#222;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);font-size:16px;min-height:1.2em}

/* 上下課鐘 */
.bellwrap{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:4vw;padding:3vh 4vw}
.bellwrap>div{min-width:0}
.nowrow{display:flex;align-items:center;gap:1.5vw;flex-wrap:nowrap}
.bellicon{flex:none;font-size:clamp(34px,4vw,64px);line-height:1;transform-origin:50% 8%;display:inline-block}
.bellicon.ring{animation:swing .5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-18deg)}50%{transform:rotate(18deg)}}
.nowtime{white-space:nowrap;font-size:clamp(38px,6vw,110px);line-height:1.05;color:var(--tomato-d);-webkit-text-stroke:.03em currentColor;text-shadow:.04em .04em 0 rgba(255,150,130,.3)}
.next{font-size:clamp(18px,1.9vw,31px);color:var(--dim);margin:6px 0 2.5vh;min-height:1.5em}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.big{display:flex;align-items:center;justify-content:center;gap:.3em;white-space:nowrap;min-width:0;border:3px solid var(--line);border-radius:var(--blob);font-size:clamp(32px,4.8vw,84px);padding:4vh 6px;cursor:pointer;box-shadow:6px 6px 0 rgba(255,107,91,.25);transition:transform .1s,box-shadow .1s;-webkit-text-stroke:.02em currentColor}
.big:hover{transform:rotate(-1deg) scale(1.02)}
.big:active{transform:translate(4px,4px);box-shadow:2px 2px 0 rgba(255,107,91,.25)}
.big.in{background:var(--butter);color:#7a4f00;border-color:#f0c25a}
.big.out{background:#bfe6b8;color:#2f6a2a;border-color:#8fcf88}
.ringing{margin-top:2vh;background:var(--paper);border:2.5px solid var(--line);border-radius:var(--blob);padding:8px 18px;font-size:24px;display:flex;justify-content:space-between;align-items:center}
.ringing button{background:var(--tomato);color:#fff;border:0;border-radius:12px;padding:4px 18px;cursor:pointer;font-size:19px}
.opts{margin-top:2.5vh;display:flex;flex-direction:column;gap:12px;font-size:19px}
.opts label{display:flex;gap:10px;align-items:center}
.opts input[type=checkbox]{width:22px;height:22px;accent-color:var(--tomato)}
.opts input[type=range]{accent-color:var(--tomato);width:200px}
.state{font-size:16px;color:var(--dim)} .state.bad{color:var(--red)}
.sched{background:var(--paper);border:2.5px solid var(--line);border-radius:var(--blob);padding:16px 20px;box-shadow:var(--shadow);align-self:start}
.sched h2{margin:0 0 10px;font-size:26px}
.addrow{display:grid;grid-template-columns:120px 100px 1fr auto;gap:8px;margin-bottom:8px}
.addrow .btn{background:var(--tomato);color:#fff;border-color:var(--tomato-d);font-size:18px}
.list{list-style:none;margin:10px 0;padding:0;max-height:46vh;overflow-y:auto}
.list li{display:flex;align-items:center;gap:12px;padding:7px 4px;border-bottom:2px dashed var(--line);font-size:21px}
.list .t{min-width:3.4em}
.chip{font-size:16px;border-radius:99px;padding:0 12px;border:2px solid var(--line)}
.chip.in{background:var(--butter);color:#7a4f00;border-color:#f0c25a} .chip.out{background:#bfe6b8;color:#2f6a2a;border-color:#8fcf88}
.list .l{flex:1;color:var(--dim);min-width:0;overflow-wrap:anywhere}
.list .btn{padding:1px 10px;font-size:15px;box-shadow:2px 2px 0 rgba(255,107,91,.25)}
.row2{display:flex;gap:10px;flex-wrap:wrap}

/* 番茄鐘 */
.pomo{--acc:var(--tomato);--acc-d:var(--tomato-d);--tom:#ff6b5b;--tom-d:#e84a3b;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;padding:2vh 4vw 4vh;text-align:center}
.pomo.rest{--acc:#6dbf8a;--acc-d:#3f9a63;--tom:#9bdcb0;--tom-d:#6dbf8a}
.pomo .bar{width:60vw}
.tomato{width:min(24vh,190px);height:auto;filter:drop-shadow(4px 5px 0 rgba(255,107,91,.2))}
.pomo.running .tomato{animation:bob 1.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.tomato .eo{display:block} .tomato .ec,.tomato .zz{display:none}
.pomo.rest .tomato .eo{display:none} .pomo.rest .tomato .ec,.pomo.rest .tomato .zz{display:block}
.pomo.rest .tomato .zz{animation:zz 2s ease-in-out infinite}
@keyframes zz{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
.phase{font-size:clamp(30px,4.2vw,76px);color:var(--acc-d);-webkit-text-stroke:.02em currentColor;line-height:1.1}
.pstat{font-size:clamp(18px,1.9vw,32px);color:var(--dim)}
.ptime{font-size:min(18vw,28vh);line-height:1;color:var(--ink);-webkit-text-stroke:.03em currentColor;text-shadow:.04em .04em 0 rgba(255,150,130,.3)}
.pbtns{display:flex;gap:18px;margin-top:1.5vh;flex-wrap:wrap;justify-content:center}
.pbtns .btn{font-size:clamp(22px,2.4vw,40px);padding:8px 36px}
.pbtns .main{background:var(--acc);color:#fff;border-color:var(--acc-d);min-width:6em}
.pset{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:1.5vh;font-size:19px;color:var(--dim);background:var(--paper);border:2.5px solid var(--line);border-radius:var(--blob);padding:10px 24px;box-shadow:var(--shadow)}
.pset label{display:flex;gap:8px;align-items:center}
.pset input[type=number]{width:78px;text-align:center}
.pset input[type=checkbox]{width:22px;height:22px;accent-color:var(--tomato)}
.pdone{color:var(--tomato-d)}

@media (max-width:860px){.info{grid-template-columns:1fr 1fr}.subject{max-width:60vw}.bellwrap{grid-template-columns:1fr}.addrow{grid-template-columns:1fr 1fr}.addrow input[type=text]{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){.btn,.big{transition:none}.deco span,.tomato,.bellicon,.zz{animation:none!important}}
</style>
</head>
<body>
<div class="deco" aria-hidden="true">
  <span style="top:14%;left:2%">☁️</span><span style="top:30%;right:3%">⭐</span><span style="top:62%;left:1.5%">🌸</span>
  <span style="top:80%;right:5%">🍀</span><span style="top:8%;left:46%">☁️</span><span style="top:88%;left:38%">✨</span>
</div>
<nav class="tabs" role="tablist" aria-label="功能分頁">
  <button class="tab" role="tab" data-tab="exam">📝 考試大鐘</button>
  <button class="tab" role="tab" data-tab="bell">🔔 上下課鐘</button>
  <button class="tab" role="tab" data-tab="pomo">🍅 讀書番茄鐘</button>
</nav>
<div class="toolbar">
  <button class="btn" id="bSet" aria-expanded="false">設定</button>
  <button class="btn" id="bFs">全螢幕</button>
</div>

<!-- ===== 考試大鐘 ===== -->
<section class="panel" id="p-exam">
  <section class="drawer" id="drawer" hidden aria-label="考試設定">
    <h2>考試設定</h2>
    <div class="f"><label for="subject">考試科目</label><input id="subject" placeholder="例如：國文"></div>
    <div class="two">
      <div class="f"><label for="start">開始時間</label><input type="time" id="start"></div>
      <div class="f"><label for="end">結束時間</label><input type="time" id="end"></div>
    </div>
    <div class="f"><label for="proctors">監考老師</label><input id="proctors" placeholder="例如：王老師、李老師"></div>
    <div class="two">
      <div class="f"><label for="expected">應到人數</label><input type="number" id="expected" min="0" inputmode="numeric"></div>
      <div class="f"><label for="actual">實到人數</label><input type="number" id="actual" min="0" inputmode="numeric"></div>
    </div>
    <div class="err" id="err" role="alert"></div>
  </section>
  <main class="stage">
    <div><div class="subject" id="vSubject"></div><div class="date" id="vDate"></div></div>
    <div class="clock" id="vClock" aria-label="目前時間">00:00:00</div>
    <div class="status">
      <div class="label" id="vLabel"></div>
      <div class="remain" id="vRemain"></div>
      <div class="bar"><i id="vBar"></i></div>
    </div>
    <div class="info">
      <div class="cell"><div class="k">考試時間</div><div class="v" id="vRange">—</div></div>
      <div class="cell"><div class="k">監考老師</div><div class="v" id="vProc">—</div></div>
      <div class="cell"><div class="k">應到</div><div class="v num" id="vExp">—</div></div>
      <div class="cell"><div class="k">實到</div><div class="v num" id="vAct">—</div></div>
      <div class="cell absent"><div class="k">缺考</div><div class="v num" id="vAbs">—</div></div>
    </div>
  </main>
</section>

<!-- ===== 上下課鐘 ===== -->
<section class="panel" id="p-bell" hidden>
  <div class="bellwrap">
    <div>
      <div class="nowrow"><span class="bellicon" id="bBell" aria-hidden="true"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="#ffd87a" stroke="#e0a030" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21a2 2 0 0 0 4 0"/><path d="M12 3V2" /></svg></span><div class="nowtime" id="bNow">00:00:00</div></div>
      <div class="next" id="bNext"></div>
      <div class="bigbtns">
        <button class="big in" id="bIn">上課鈴</button>
        <button class="big out" id="bOut">下課鈴</button>
      </div>
      <div class="ringing" id="bRing" hidden><span id="bRingTxt"></span><button id="bStop">停止</button></div>
      <div class="opts">
        <label><input type="checkbox" id="bAuto"> 時間到自動響鈴</label>
        <label>音量 <input type="range" id="bVol" min="0" max="1" step="0.05" aria-label="音量"></label>
        <div class="state" id="bState"></div>
      </div>
    </div>
    <div class="sched">
      <h2>📒 課表</h2>
      <div class="addrow">
        <input type="time" id="bTime" aria-label="鈴聲時間">
        <select id="bKind" aria-label="鈴聲種類"><option value="in">上課</option><option value="out">下課</option></select>
        <input type="text" id="bLabel" placeholder="備註（例如：第 1 節）" aria-label="備註">
        <button class="btn" id="bAdd">新增</button>
      </div>
      <div class="err" id="bMsg" role="alert"></div>
      <ul class="list" id="bList"></ul>
      <div class="row2">
        <button class="btn" id="bSample">載入範例課表</button>
        <button class="btn" id="bClear">全部清除</button>
      </div>
    </div>
  </div>
</section>

<!-- ===== 讀書番茄鐘 ===== -->
<section class="panel pomo" id="p-pomo" hidden>
  <svg class="tomato" viewBox="0 0 140 140" aria-hidden="true">
    <ellipse cx="70" cy="128" rx="40" ry="6" fill="rgba(0,0,0,.08)"/>
    <ellipse cx="70" cy="80" rx="54" ry="48" style="fill:var(--tom)"/>
    <ellipse cx="50" cy="60" rx="12" ry="7" fill="#fff" opacity=".45" transform="rotate(-30 50 60)"/>
    <path d="M70 40 L58 22 L68 30 L70 14 L74 30 L84 20 L78 40 Z" fill="#6cc070"/>
    <path d="M70 40 C60 30 44 34 42 44 C54 46 64 44 70 40 Z" fill="#7cc576"/>
    <path d="M70 40 C80 30 96 34 98 44 C86 46 76 44 70 40 Z" fill="#7cc576"/>
    <rect x="67" y="14" width="6" height="14" rx="3" fill="#4f9e55"/>
    <g class="eo"><circle cx="50" cy="82" r="6" fill="#4a3030"/><circle cx="90" cy="82" r="6" fill="#4a3030"/><circle cx="52" cy="80" r="2" fill="#fff"/><circle cx="92" cy="80" r="2" fill="#fff"/></g>
    <g class="ec" fill="none" stroke="#4a3030" stroke-width="4" stroke-linecap="round"><path d="M43 83 Q50 90 57 83"/><path d="M83 83 Q90 90 97 83"/></g>
    <ellipse cx="38" cy="96" rx="9" ry="6" fill="#ff9aa8" opacity=".75"/><ellipse cx="102" cy="96" rx="9" ry="6" fill="#ff9aa8" opacity=".75"/>
    <path d="M60 98 Q70 108 80 98" fill="none" stroke="#4a3030" stroke-width="4" stroke-linecap="round"/>
    <text class="zz" x="104" y="52" font-size="22" font-weight="700" fill="#5aa0c8">z<tspan dx="3" dy="-10" font-size="16">z</tspan></text>
  </svg>
  <div class="phase" id="pPhase">專注</div>
  <div class="pstat" id="pStat"></div>
  <div class="ptime" id="pTime">25:00</div>
  <div class="bar"><i id="pBar"></i></div>
  <div class="pbtns">
    <button class="btn main" id="pStart">開始</button>
    <button class="btn" id="pReset">重設</button>
    <button class="btn" id="pSkip">跳過</button>
  </div>
  <div class="pset">
    <label>專注 <input type="number" id="pFocus" min="1" max="180"> 分鐘</label>
    <label>休息 <input type="number" id="pRest" min="1" max="60"> 分鐘</label>
    <label><input type="checkbox" id="pAuto"> 自動開始下一階段</label>
    <span class="pdone" id="pDone"></span>
  </div>
</section>
<div class="toast" id="toast"></div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const z = n => String(n).padStart(2,'0');
  const ld = (k,d) => { try{ return Object.assign(d, JSON.parse(localStorage.getItem(k)||'null')||{}); }catch(e){ return d; } };
  const sv = (k,v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
  const fmt = s => s>=3600 ? Math.floor(s/3600)+':'+z(Math.floor(s%3600/60))+':'+z(s%60) : z(Math.floor(s/60))+':'+z(s%60);
  const dig = s => String(s).split('').map(c=>'<i class="'+(/\d/.test(c)?'d':'c')+'">'+c+'</i>').join('');
  function setClock(el,s){ if(el._s!==s){ el._s=s; el.innerHTML=dig(s); } }
  const dayKey = d => d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  const atTime = (base,hhmm) => {
    if(!/^\d{1,2}:\d{2}$/.test(hhmm||'')) return null;
    const [h,m] = hhmm.split(':').map(Number), d = new Date(base); d.setHours(h,m,0,0); return d;
  };
  function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',3000); }

  /* ================= 分頁 ================= */
  const TABS = ['exam','bell','pomo'];
  let tab = ld('time-tools-tab',{t:'exam'}).t;
  if(!TABS.includes(tab)) tab='exam';
  let examAlert = false;
  function applyAlert(){ document.body.classList.toggle('alert', examAlert && tab==='exam'); }
  function setTab(t){
    tab = t; sv('time-tools-tab',{t});
    TABS.forEach(n=>{ $('p-'+n).hidden = n!==t; });
    document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===t));
    $('bSet').hidden = t!=='exam';
    syncDrawer(); applyAlert();
    if(t!=='pomo') document.title='課堂時間管理';
  }
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

  /* ================= 考試大鐘 ================= */
  const EK = 'exam-clock-v1', WEEK = ['日','一','二','三','四','五','六'];
  const S = ld(EK,{subject:'',start:'',end:'',proctors:'',expected:'',actual:'',panel:true});
  S.panel = S.panel && !(S.subject && S.start && S.end);
  ['subject','start','end','proctors','expected','actual'].forEach(id=>{
    $(id).value = S[id];
    $(id).addEventListener('input', ()=>{ S[id]=$(id).value; sv(EK,S); renderExam(new Date()); });
  });
  function syncDrawer(){
    const open = tab==='exam' && S.panel;
    $('drawer').hidden = !open; $('bSet').setAttribute('aria-expanded', open);
    $('bSet').textContent = S.panel ? '收起設定' : '設定';
  }
  $('bSet').onclick = () => { S.panel = !S.panel; sv(EK,S); syncDrawer(); };
  const num = v => (v===''||v==null||isNaN(+v)||+v<0) ? null : Math.floor(+v);

  function renderExam(now){
    setClock($('vClock'), z(now.getHours())+':'+z(now.getMinutes())+':'+z(now.getSeconds()));
    $('vDate').textContent = now.getFullYear()+' 年 '+(now.getMonth()+1)+' 月 '+now.getDate()+' 日　星期'+WEEK[now.getDay()];
    const sub = $('vSubject');
    sub.textContent = S.subject.trim() || '請在「設定」輸入考試科目';
    sub.classList.toggle('empty', !S.subject.trim());

    const st = atTime(now,S.start); let en = atTime(now,S.end), alert = false;
    const label=$('vLabel'), remain=$('vRemain'), bar=$('vBar');
    remain.className = 'remain';
    if(!st || !en){
      label.textContent=''; remain.textContent='請設定考試開始與結束時間'; remain.style.fontSize='clamp(22px,3vw,56px)';
      bar.style.width='0'; $('vRange').textContent='—';
    } else {
      remain.style.fontSize='';
      if(en<=st) en = new Date(en.getTime()+86400000);
      $('vRange').textContent = S.start+' – '+S.end+'（共 '+Math.round((en-st)/60000)+' 分鐘）';
      const mm = ms => { const s=Math.max(0,Math.ceil(ms/1000)); return '<b>'+dig(Math.floor(s/60))+'</b> 分鐘<small>'+dig(z(s%60))+' 秒</small>'; };
      if(now<st){ label.textContent='尚未開始，距離開始'; remain.innerHTML=mm(st-now); bar.style.width='0'; }
      else if(now<en){
        label.textContent='距離考試結束'; remain.innerHTML=mm(en-now);
        bar.style.width=((now-st)/(en-st)*100).toFixed(2)+'%';
        alert = (en-now)<=600000;           // 最後 10 分鐘
      } else { label.textContent=''; remain.textContent='考試時間結束 🎉'; remain.classList.add('done'); bar.style.width='100%'; }
    }
    examAlert = alert; applyAlert();
    $('vProc').textContent = S.proctors.trim() || '—';
    const e=num(S.expected), a=num(S.actual); let err='';
    $('vExp').textContent = e==null?'—':e; $('vAct').textContent = a==null?'—':a;
    if(e!=null && a!=null){
      if(a>e){ err='實到人數不能大於應到人數，請檢查。'; $('vAbs').textContent='—'; } else $('vAbs').textContent=e-a;
    } else $('vAbs').textContent='—';
    $('err').textContent = err;
  }

  /* ================= 音效（Web Audio） ================= */
  const BK = 'class-bell-v1';
  const B = ld(BK,{list:[],auto:true,vol:.8});
  let actx=null, master=null, bus=null, ringT=null;
  function AC(){
    if(!actx){
      const C = window.AudioContext||window.webkitAudioContext; if(!C) return null;
      actx = new C(); master = actx.createGain(); master.gain.value = B.vol; master.connect(actx.destination);
    }
    if(actx.state==='suspended') actx.resume();
    return actx;
  }
  ['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev, AC, {passive:true}));
  // 鐘聲：基音加上幾個非整數倍泛音，高頻衰減較快
  function strike(freq,t,dur,vol,dest){
    [[1,1],[2.76,.5],[5.4,.22],[8.93,.1]].forEach(([r,g])=>{
      const o=actx.createOscillator(), e=actx.createGain(), d=dur/(1+(r-1)*.4);
      o.type='sine'; o.frequency.value=freq*r;
      e.gain.setValueAtTime(vol*g,t); e.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(e); e.connect(dest); o.start(t); o.stop(t+d+.05);
    });
  }
  function stopRing(){
    clearTimeout(ringT);
    if(bus && actx){ const n=actx.currentTime; bus.gain.cancelScheduledValues(n); bus.gain.setValueAtTime(bus.gain.value,n); bus.gain.linearRampToValueAtTime(0,n+.08); }
    bus=null; $('bRing').hidden=true; $('bBell').classList.remove('ring');
  }
  function ring(kind){
    if(!AC()){ toast('此瀏覽器不支援音效。'); return; }
    stopRing();
    const t0=actx.currentTime+.05; bus=actx.createGain(); bus.connect(master);
    let dur;
    if(kind==='in'){          // 上課鈴：高低兩音快速重複
      for(let i=0;i<8;i++){ strike(932,t0+i*.75,.7,.22,bus); strike(698,t0+i*.75+.3,.7,.22,bus); }
      dur=6.5;
    } else {                  // 下課鈴：緩慢的四音旋律，重複兩次
      [[659,0],[523,.9],[587,1.8],[392,2.7],[392,4.8],[587,5.7],[659,6.6],[523,7.5]].forEach(([f,d])=>strike(f,t0+d,1.8,.25,bus));
      dur=10;
    }
    $('bRingTxt').textContent = (kind==='in'?'上課鈴':'下課鈴')+'播放中…'; $('bRing').hidden=false; $('bBell').classList.add('ring');
    ringT=setTimeout(stopRing, dur*1000+300);
  }
  function chime(kind){      // 番茄鐘提示音
    if(!AC()) return;
    const t0=actx.currentTime+.05, b=actx.createGain(); b.connect(master);
    (kind==='focus' ? [[784,0],[988,.3],[1175,.6]] : [[1175,0],[880,.35]]).forEach(([f,d])=>strike(f,t0+d,1.3,.25,b));
  }

  /* ================= 上下課鐘 ================= */
  const fired = {};
  const KIND = {in:'上課', out:'下課'};
  function renderList(){
    const ul=$('bList'); ul.innerHTML='';
    if(!B.list.length){ const li=document.createElement('li'); li.style.color='var(--dim)'; li.textContent='尚無課表，請新增，或載入範例課表。'; ul.appendChild(li); return; }
    B.list.slice().sort((a,b)=>a.time.localeCompare(b.time)||a.kind.localeCompare(b.kind)).forEach(e=>{
      const li=document.createElement('li'), t=document.createElement('span'), c=document.createElement('span'), l=document.createElement('span'), d=document.createElement('button');
      t.className='t'; t.textContent=e.time; c.className='chip '+e.kind; c.textContent=KIND[e.kind];
      l.className='l'; l.textContent=e.label||''; d.className='btn'; d.textContent='刪除'; d.setAttribute('aria-label','刪除 '+e.time+' '+KIND[e.kind]);
      d.onclick=()=>{ B.list=B.list.filter(x=>x.id!==e.id); sv(BK,B); renderList(); };
      li.append(t,c,l,d); ul.appendChild(li);
    });
  }
  function addEntry(time,kind,label,silent){
    const now=new Date(), id=Date.now()+'-'+Math.random().toString(36).slice(2,6);
    B.list.push({id,time,kind,label});
    const tg=atTime(now,time); if(tg && tg<=now) fired[dayKey(now)+'|'+id]=1;   // 已過的時間今天不補響
  }
  $('bAdd').onclick = () => {
    const time=$('bTime').value, kind=$('bKind').value, label=$('bLabel').value.trim();
    if(!time){ $('bMsg').textContent='請先選擇鈴聲時間。'; return; }
    if(B.list.some(e=>e.time===time && e.kind===kind)){ $('bMsg').textContent='這個時間已經有相同的鈴聲了。'; return; }
    $('bMsg').textContent=''; addEntry(time,kind,label); sv(BK,B); renderList(); $('bLabel').value='';
  };
  $('bLabel').addEventListener('keydown',e=>{ if(e.key==='Enter') $('bAdd').click(); });
  $('bSample').onclick = () => {
    const rows=[['08:30','in','第 1 節'],['09:15','out',''],['09:25','in','第 2 節'],['10:10','out',''],['10:20','in','第 3 節'],['11:05','out',''],['11:15','in','第 4 節'],['12:00','out','午休'],['13:30','in','第 5 節'],['14:15','out','']];
    rows.forEach(([t,k,l])=>{ if(!B.list.some(e=>e.time===t&&e.kind===k)) addEntry(t,k,l); });
    sv(BK,B); renderList();
  };
  $('bClear').onclick = () => { if(!B.list.length || confirm('確定要清除所有課表嗎？')){ B.list=[]; sv(BK,B); renderList(); } };
  $('bIn').onclick = () => ring('in');
  $('bOut').onclick = () => ring('out');
  $('bStop').onclick = stopRing;
  $('bAuto').checked = B.auto; $('bVol').value = B.vol;
  $('bAuto').onchange = () => { B.auto=$('bAuto').checked; sv(BK,B); AC(); };
  $('bVol').oninput = () => { B.vol=+$('bVol').value; sv(BK,B); if(master) master.gain.value=B.vol; };

  function tickBell(now){
    setClock($('bNow'), z(now.getHours())+':'+z(now.getMinutes())+':'+z(now.getSeconds()));
    const day = dayKey(now); let nx=null;
    B.list.forEach(e=>{
      const tg=atTime(now,e.time); if(!tg) return;
      const key=day+'|'+e.id;
      if(B.auto && !fired[key] && tg<=now && now-tg<=90000){ fired[key]=1; ring(e.kind); }   // 90 秒內補響，避免分頁背景節流漏鈴
      if(tg>now && (!nx || tg<nx.tg)) nx={tg,e};
    });
    $('bNext').textContent = nx
      ? '下一個鈴聲　'+nx.e.time+' '+KIND[nx.e.kind]+(nx.e.label?'（'+nx.e.label+'）':'')+'　倒數 '+fmt(Math.ceil((nx.tg-now)/1000))+(B.auto?'':'（自動響鈴已關閉）')
      : (B.list.length ? '今天已沒有後續鈴聲' : '尚未設定課表');
    const ok = actx && actx.state==='running', s=$('bState');
    s.textContent = ok ? '音效已啟用。請保持此頁開啟，到時間會自動響鈴。' : '請先點一下本頁任何地方（或按任一鈴聲按鈕），瀏覽器才允許自動響鈴。';
    s.classList.toggle('bad', !ok && B.auto);
  }

  /* ================= 讀書番茄鐘 ================= */
  const PK = 'pomodoro-v1';
  const P = ld(PK,{focus:25,rest:5,auto:true,done:0,day:''});
  if(P.day!==dayKey(new Date())){ P.day=dayKey(new Date()); P.done=0; }
  let ph='focus', run=false, endAt=0;
  const dur = p => (p==='focus'?P.focus:P.rest)*60000;
  let rem = dur('focus');
  $('pFocus').value=P.focus; $('pRest').value=P.rest; $('pAuto').checked=P.auto;

  function pStart(){
    AC();
    if(run){ rem=Math.max(0,endAt-Date.now()); run=false; }
    else { if(rem<=0) rem=dur(ph); endAt=Date.now()+rem; run=true; }
    renderPomo();
  }
  function pReset(){ ph='focus'; run=false; rem=dur('focus'); renderPomo(); }
  function pNext(natural){
    if(natural && ph==='focus'){ P.done++; P.day=dayKey(new Date()); sv(PK,P); }
    ph = ph==='focus' ? 'rest' : 'focus'; rem = dur(ph);
  }
  function pSkip(){ pNext(false); if(run) endAt=Date.now()+rem; renderPomo(); }
  $('pStart').onclick=pStart; $('pReset').onclick=pReset; $('pSkip').onclick=pSkip;
  $('pAuto').onchange=()=>{ P.auto=$('pAuto').checked; sv(PK,P); };
  [['pFocus','focus'],['pRest','rest']].forEach(([id,p])=>$(id).addEventListener('input',()=>{
    const v=parseInt($(id).value); if(!(v>=1)) return;
    P[p]=Math.min(v,p==='focus'?180:60); sv(PK,P);
    if(!run && ph===p) rem=dur(ph);
    renderPomo();
  }));
  document.addEventListener('keydown',e=>{
    if(tab==='pomo' && e.code==='Space' && !['INPUT','BUTTON','SELECT'].includes((document.activeElement||{}).tagName)){ e.preventDefault(); pStart(); }
  });

  function tickPomo(){
    if(run){
      const left=endAt-Date.now();
      if(left<=0){
        chime(ph); const keep=P.auto; pNext(true);
        if(keep) endAt=Date.now()+rem; else run=false;
      } else rem=left;
    }
    renderPomo();
  }
  function renderPomo(){
    const secs=Math.ceil(rem/1000), full=dur(ph), started=rem<full;
    $('p-pomo').classList.toggle('rest', ph==='rest');
    $('p-pomo').classList.toggle('running', run);
    $('pPhase').textContent = ph==='focus' ? '專注時間' : '休息時間';
    $('pStat').textContent = run ? '進行中' : (started ? '已暫停' : '準備開始');
    setClock($('pTime'), fmt(secs));
    $('pBar').style.width = ((1-rem/full)*100).toFixed(2)+'%';
    $('pStart').textContent = run ? '暫停' : (started ? '繼續' : '開始');
    $('pDone').textContent = '🍅 今天已完成 '+P.done+' 個番茄';
    if(tab==='pomo') document.title = run ? fmt(secs)+' '+(ph==='focus'?'專注':'休息')+'｜課堂時間管理' : '課堂時間管理';
  }

  /* ================= 全螢幕 ================= */
  const root=document.documentElement, fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
  $('bFs').onclick = () => {
    const req=root.requestFullscreen||root.webkitRequestFullscreen, ex=document.exitFullscreen||document.webkitExitFullscreen;
    if(!req){ toast('此瀏覽器不支援全螢幕，請改用電腦版 Chrome 或 Edge。'); return; }
    try{ if(fsEl()) ex.call(document); else { const p=req.call(root); if(p&&p.catch) p.catch(()=>toast('無法進入全螢幕。')); } }
    catch(e){ toast('無法進入全螢幕。'); }
  };
  let idleT;
  function wake(){ document.body.classList.remove('idle'); clearTimeout(idleT); if(fsEl()) idleT=setTimeout(()=>document.body.classList.add('idle'),3000); }
  function fsChange(){ const on=!!fsEl(); document.body.classList.toggle('fs',on); $('bFs').textContent=on?'離開全螢幕':'全螢幕'; wake(); }
  document.addEventListener('fullscreenchange',fsChange);
  document.addEventListener('webkitfullscreenchange',fsChange);
  ['mousemove','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,wake,{passive:true}));

  /* ================= 啟動 ================= */
  renderList(); setTab(tab);
  const loop = () => { const now=new Date(); renderExam(now); tickBell(now); tickPomo(); };
  loop(); setInterval(loop,250);
})();
</script>
</body>
</html>
